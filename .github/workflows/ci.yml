name: ci
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup | Development environment
        uses: ./.github/actions/setup

      - name: Setup | Generate Code
        run: pnpm run gen

      - name: Run | Lint
        run: pnpm run lint --deny-warnings

  format:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup | Development environment
        uses: ./.github/actions/setup

      - name: Setup | Generate Code
        run: pnpm run gen

      - name: Run | Format
        run: pnpm run format:check

  knip:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup | Development environment
        uses: ./.github/actions/setup

      - name: Setup | Generate Code
        run: pnpm run gen

      - name: Run | Knip
        run: pnpm run knip
        env:
          # oxc-parserのraw-transferは約6 GiBの仮想メモリを予約し、ubuntu-slimでは確保に失敗するため無効化する。
          KNIP_DISABLE_RAW_TRANSFER: "1"

  typecheck:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup | Development environment
        uses: ./.github/actions/setup

      - name: Setup | Generate Code
        run: pnpm run gen

      - name: Run | Typecheck
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup | Development environment
        uses: ./.github/actions/setup

      - name: Setup | Generate Code
        run: pnpm run gen

      - name: Run | Test
        run: pnpm run test
